[versions]
spring-boot = "4.1.2"
jooq = "3.21.9"
archunit = "1.5.1"

[libraries]
# Spring Boot 버전표(BOM): 아래 버전 없는 라이브러리들의 버전을 여기서 정해줌
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-test    = { module = "org.springframework.boot:spring-boot-starter-test" }

spring-jackson = { module = "org.springframework.boot:spring-boot-starter-jackson" }
spring-webmvc  = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-kafka   = { module = "org.springframework.boot:spring-boot-starter-kafka" }
mariadb        = { module = "org.mariadb.jdbc:mariadb-java-client" }

spring-jooq    = { module = "org.springframework.boot:spring-boot-starter-jooq" }
spring-flyway  = { module = "org.springframework.boot:spring-boot-starter-flyway" }
flyway-mysql   = { module = "org.flywaydb:flyway-mysql" }

jooq-meta-extensions = { module = "org.jooq:jooq-meta-extensions", version.ref = "jooq" }

spring-boot-testcontainers  = { module = "org.springframework.boot:spring-boot-testcontainers" }
testcontainers-junit        = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-mariadb      = { module = "org.testcontainers:testcontainers-mariadb" }
testcontainers-kafka        = { module = "org.testcontainers:testcontainers-kafka" }

# 공통 테스트
junit-jupiter  = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
jooq-codegen = { id = "org.jooq.jooq-codegen-gradle", version.ref = "jooq" }