services:
  mariadb:
    image: mariadb:11.8                # 버전 고정 (LTS)
    container_name: coin-mariadb
    ports:
      - "3307:3306"                   # 호스트 3306은 로컬 MySQL이 사용 중
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    command:
      - --character-set-server=utf8mb4        # 이모지·다국어 안전
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00            # DB는 UTC로 저장, 표시할 때 KST 변환
    volumes:
      - mariadb-data:/var/lib/mysql           # 컨테이너 지워도 데이터 유지
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.1.0          # KRaft 모드 (ZooKeeper 없음)
    container_name: coin-kafka
    ports:
      - "19092:19092"                 # 호스트 9092는 다른 프로젝트 kafka1이 사용 중
    environment:
      # 이 노드가 브로커 + 컨트롤러를 둘 다 맡음 (로컬 단일 노드)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # 리스너 3개: 컨테이너 내부용 / 내 PC용 / 컨트롤러용
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # 브로커가 1개라 복제 수를 1로 (기본값 3이면 에러남)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0   # 로컬에서 컨슈머 시작 빠르게
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    container_name: coin-kafka-ui
    ports:
      - "8089:8080"                          # 다른 프로젝트 kafka-ui와 겹치지 않게 8089
    environment:
      KAFKA_CLUSTERS_0_NAME: coin-premium-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092   # 컨테이너끼리는 INTERNAL 리스너
    depends_on:
      kafka:
        condition: service_healthy           # Kafka가 준비된 뒤에 시작

volumes:
  mariadb-data: