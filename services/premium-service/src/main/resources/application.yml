spring:
  application:
    name: premium-service
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: localhost:19092
    consumer:
      group-id: premium-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer   # 문자열로 받아서 직접 변환
  mvc: # ← 추가
    problemdetails:
      enabled: true
  config:
    import: "optional:file:.env[.properties],optional:file:../../.env[.properties]"
  datasource:
    url: jdbc:mariadb://localhost:3307/${MARIADB_DATABASE:coin_premium}
    username: ${MARIADB_USER:coin}
    password: ${MARIADB_PASSWORD:}
  jooq:
    sql-dialect: MARIADB
  data:
    redis:
      host: localhost
      port: 6380   # docker-compose의 Valkey (Redis 호환 프로토콜)
      timeout: 500ms           # 명령 응답 대기 (기본 60초). 같은 서버 안 저장소라 평소 1ms 남짓
      connect-timeout: 1s      # 연결 맺기 대기

server:
  port: 8081   # 8080은 다른 프로젝트 kafka-ui가 사용 중

premium:
  freshness:
    max-quote-age: 60s   # 거래가 뜸한 코인을 추가할 때 다시 볼 것 (체결 없이 60초가 흔하면 공백이 자주 생김)
  backfill:
    lookback: 6h        # 최근 6시간만 검사 (오래된 공백은 4단계 일일 배치)
    settle-delay: 2m    # 최근 2분은 제외 (실시간 저장이 아직 안 끝났을 수 있음)
  fx:
    switch-time: "11:00"   # 수출입은행 일환율은 영업일 11시 전후 업데이트 → 실제 수신 시각을 보며 조정
  exchange-api:
    upbit-url: https://api.upbit.com
    binance-url: https://data-api.binance.vision   # 시세 전용 공개 주소 (확인 필요: 안 되면 https://api.binance.com)
    timeout: 5s
  last-known:
    initial-delay: 5s       # 기동 직후 기억이 빈 구간 (Valkey 장애 시 503 가능 구간)
    refresh-interval: 30s   # 인스턴스별 마지막 김프 갱신 주기 (ShedLock 없음)