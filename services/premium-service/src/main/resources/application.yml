spring:
  application:
    name: premium-service
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: localhost:19092
    consumer:
      group-id: premium-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer   # 문자열로 받아서 직접 변환
  mvc: # ← 추가
    problemdetails:
      enabled: true
  config:
    import: "optional:file:.env[.properties],optional:file:../../.env[.properties]"
  datasource:
    url: jdbc:mariadb://localhost:3307/${MARIADB_DATABASE:coin_premium}
    username: ${MARIADB_USER:coin}
    password: ${MARIADB_PASSWORD:}
  jooq:
    sql-dialect: MARIADB

server:
  port: 8081   # 8080은 다른 프로젝트 kafka-ui가 사용 중

premium:
  symbols:
    - BTC
    - ETH