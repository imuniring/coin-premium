spring:
  application:
    name: collector-service
  threads:
    virtual:
      enabled: true      # Virtual Threads 사용
  main:
    keep-alive: true     # 웹 서버 없이도 앱이 종료되지 않게 유지

exchange:
  upbit:
    url: wss://api.upbit.com/websocket/v1
    codes:
      - KRW-BTC
      - KRW-ETH
  binance:
    url: wss://data-stream.binance.vision   # 시세 전용 엔드포인트
    symbols:
      - BTCUSDT
      - ETHUSDT