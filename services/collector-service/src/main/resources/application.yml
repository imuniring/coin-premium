server:
  port: 8082

spring:
  application:
    name: collector-service
  threads:
    virtual:
      enabled: true      # Virtual Threads 사용
  main:
    keep-alive: true     # 웹 서버 없이도 앱이 종료되지 않게 유지
  kafka:
    bootstrap-servers: localhost:19092   # docker-compose에서 바꾼 포트
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all                          # 브로커가 확실히 저장했을 때만 성공
      properties:
        enable.idempotence: true
        linger.ms: 5
        spring.json.add.type.headers: false
        max.block.ms: 5000                   # 메타데이터 대기 최대 5초 (기본 60초, #42)
        delivery.timeout.ms: 300000          # 프로듀서 버퍼 안의 체결을 5분까지 재시도 (기본 2분)
  config:
    # 루트의 .env를 설정값으로 읽어옴 (실행 위치에 따라 경로가 달라서 두 개 지정)
    import: "optional:file:.env[.properties],optional:file:../../.env[.properties]"

exchange:
  upbit:
    url: wss://api.upbit.com/websocket/v1
    codes:
      - KRW-BTC
      - KRW-ETH
  binance:
    url: wss://data-stream.binance.vision   # 시세 전용 엔드포인트
    symbols:
      - BTCUSDT
      - ETHUSDT
  koreaexim:
    url: https://oapi.koreaexim.go.kr/site/program/financial/exchangeJSON
    api-key: ${KOREAEXIM_API_KEY}

# 외부 API 호출 복원력 (ADR 0010 → Resilience4j 전환)
resilience4j:
  retry:
    instances:
      koreaexim:
        max-attempts: 3                       # 첫 시도 포함 최대 3번
        wait-duration: 1s                     # 첫 재시도 전 대기
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2     # 1초 → 2초
        retry-exception-predicate: com.uni.coinpremium.collector.adapter.out.koreaexim.RetryableFailure
  circuitbreaker:
    instances:
      koreaexim:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 3                # 최근 3번 호출로 판단
        minimum-number-of-calls: 3            # 3번은 채워야 판단 시작
        failure-rate-threshold: 100           # 3번 모두 실패하면 OPEN
        wait-duration-in-open-state: 10m      # 스케줄 주기(30분)보다 짧게
        permitted-number-of-calls-in-half-open-state: 1
        record-failure-predicate: com.uni.coinpremium.collector.adapter.out.koreaexim.RetryableFailure

management:
  endpoints:
    web:
      exposure:
        # 필요한 창구만 연다 (prometheus는 5단계에서 수집기를 붙일 때)
        include: health, circuitbreakers, retries, loggers, metrics
  endpoint:
    health:
      show-details: always   # 로컬 확인용. 외부 노출 시 제한 필요

collector:
  ticker-buffer:
    capacity: 50000      # 초당 약 300건 × 3분 (Before 측정: Binance 평균 110, 최대 220건/초)
    retry-backoff: 1s    # 전송 실패 후 같은 체결 재시도 간격